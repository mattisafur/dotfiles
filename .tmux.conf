set-option -g mode-keys vi  # vim keybinds in copy mode
set-option -g mouse on      # enable mouse support
set-option -g base-index 1  # set window start index to 1

# suggested by neovim
set-option -g focus-events on
set-option -a terminal-features 'xterm-256color:RGB'

# copy mode navigation
bind-key -N "Move to start of line" -T copy-mode-vi Home send-keys 0
bind-key -N "Move to end of line" -T copy-mode-vi End send-keys $
bind-key -N "Move one word forward" -T copy-mode-vi C-Right send-keys w
bind-key -N "Move one word backward" -T copy-mode-vi C-Left send-keys b

# window splitting
bind-key -N "Create new window in current directory" C-c new-window -c "#{pane_current_path}"
bind-key -N "Split right to current directory" h split-window -v -c "#{pane_current_path}"
bind-key -N "Split down to current directory" v split-window -h -c "#{pane_current_path}"
bind-key -N "Split left back to current directory" H split-window -vb -c "#{pane_current_path}"
bind-key -N "Split up back to current directory" V split-window -hb -c "#{pane_current_path}"
bind-key -N "Create new floating pane in current directory" g new-pane -c "#{pane_current_path}"

